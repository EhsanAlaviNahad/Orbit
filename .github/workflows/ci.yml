name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run core self-tests
        run: ./Scripts/test-core.sh

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in Scripts/*.sh; do bash -n "$f"; done

      - name: Validate Info.plist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, sys
          with open("Resources/Info.plist", "rb") as fh:
              data = plistlib.load(fh)
          for key in ("CFBundleIdentifier", "CFBundleShortVersionString", "CFBundleExecutable"):
              assert key in data, f"missing {key}"
          print("Info.plist OK:", data["CFBundleShortVersionString"])
          PY

      - name: Require license, changelog and contributing guide
        run: |
          set -euo pipefail
          for f in LICENSE CHANGELOG.md CONTRIBUTING.md README.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
